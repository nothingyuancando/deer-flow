name: Coordination database diagnosis
on:
  push:
    branches: [codex/8659-db-diagnosis]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deerflow
          POSTGRES_PASSWORD: deerflow
          POSTGRES_DB: deerflow_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_POSTGRES_URI: postgresql://deerflow:deerflow@localhost:5432/deerflow_test?sslmode=disable
      DEERFLOW_TEST_WORKFLOW_POSTGRES: postgresql://deerflow:deerflow@localhost:5432/deerflow_test?sslmode=disable
      DEDUPE_TEST_POSTGRES_URL: postgresql://deerflow:deerflow@localhost:5432/deerflow_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.1'
      - run: uv sync --group dev --extra postgres
        working-directory: backend
      - name: Diagnose recovery
        working-directory: backend
        env:
          PYTHONPATH: /tmp:.
        run: |
          cat > /tmp/dbprobe.py <<'PROBE'
          import logging
          import sqlite3
          from sqlalchemy import event
          from sqlalchemy.engine import Engine
          def pytest_configure(config):
              print('SQLite version:', sqlite3.sqlite_version)
              def report(context):
                  logging.getLogger('dbprobe').error('Database error: %r; SQL: %s', context.original_exception, context.statement)
              event.listen(Engine, 'handle_error', report)
          PROBE
          uv run --no-sync pytest -p dbprobe -m "not live and not bundled_extension and not benchmark" --ignore=tests/blocking_io --splits 6 --group 6 --splitting-algorithm least_duration --durations-path=.test_durations tests/ -x -q --tb=short
